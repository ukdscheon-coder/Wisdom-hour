<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17353a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Wisdom Hour | 하루 한 문장</title><link rel="manifest" href="/manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;color:#193238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:520px;margin:auto;padding:30px 20px 80px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:29px;letter-spacing:-1px}.muted{color:#728080;font-size:13px}.pill{border-radius:99px;background:#e0e9e4;padding:9px 13px;font-size:13px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0 18px}button{cursor:pointer;border:0;border-radius:14px;padding:15px 12px;font-size:15px;font-weight:650;background:#17353a;color:white}nav button{background:#e3e9e6;color:#365053}nav button.active{background:#17353a;color:white}.card{background:#fff;border-radius:24px;padding:27px 24px;box-shadow:0 8px 28px #1d3b3210;min-height:270px}.tag{font-size:12px;color:#66857b;font-weight:700;letter-spacing:1px}.word{font-size:clamp(27px,7vw,39px);font-weight:750;line-height:1.35;margin:28px 0 10px;overflow-wrap:anywhere}.reading{font-size:18px;font-weight:600;margin:0 0 20px}.meaning{font-size:17px;line-height:1.8;color:#3c5153}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1}.secondary{background:#e4ece7;color:#17353a}.outline{background:white;border:1px solid #cbd9d0;color:#17353a}.option{display:block;width:100%;text-align:left;background:#f6f8f5;color:#203a3d;margin:9px 0;padding:15px;border:1px solid #e0e9e3}.option:disabled{opacity:.7}.notice{margin:18px 0;min-height:28px;font-weight:650;color:#27694b}.foot{margin-top:30px;color:#87918c;font-size:12px;line-height:1.6}select{border:1px solid #cbd9d0;border-radius:10px;background:white;padding:12px;font-size:15px;width:100%;margin:8px 0 15px}</style></head><body><main><header><div><h1>Wisdom Hour</h1><div class="muted">하루 한 문장, 세상을 넓히는 지혜</div></div><span class="pill" id="count">0 / 0</span></header><nav><button id="learnTab" onclick="render('learn')">오늘의 문장</button><button id="quizTab" onclick="render('quiz')">퀴즈</button><button id="savedTab" onclick="render('saved')">저장함</button></nav><section class="card" id="content"></section><div class="actions" id="actions"></div><p class="notice" id="notice" aria-live="polite"></p><p class="foot">학습 기록과 즐겨찾기는 이 기기에 저장됩니다. 알림은 현재 브라우저가 열려 있는 동안만 지원합니다. 백그라운드 정기 푸시 알림은 추후 서버 기반으로 추가됩니다.</p></main><script>const entries=[["塞翁失馬","새옹지마","좋고 나쁜 일은 쉽게 단정할 수 없다.","중국 고사"],["溫故知新","온고지신","옛것을 익혀 새로운 것을 깨닫는다.","논어"],["百聞不如一見","백문불여일견","백 번 듣는 것보다 한 번 보는 것이 낫다.","한서"],["千里之行 始於足下","천리지행 시어족하","천 리 길도 한 걸음부터 시작한다.","도덕경"],["井底之蛙","정저지와","우물 안 개구리는 넓은 세상을 모른다.","장자"],["苦盡甘來","고진감래","고생 끝에 즐거움이 온다.","한자 성어"],["七転び八起き","나나코로비 야오키","여러 번 실패해도 다시 일어선다.","일본 속담"],["一期一会","이치고이치에","일생에 단 한 번일 수 있는 만남을 소중히 여긴다.","일본 표현"],["猿も木から落ちる","사루모 키카라 오치루","숙련자도 실수할 수 있다.","일본 속담"],["石の上にも三年","이시노 우에니모 산넨","인내하며 꾸준히 노력하면 성과를 얻는다.","일본 속담"],["Actions speak louder than words","행동이 말보다 크다","말보다 행동이 더 많은 것을 보여준다.","영어 속담"],["Practice makes perfect","연습이 완성을 만든다","반복적인 연습으로 실력이 향상된다.","영어 속담"],["Better late than never","늦어도 안 하는 것보다 낫다","늦게 시작해도 포기하는 것보다 낫다.","영어 속담"],["The early bird catches the worm","일찍 일어나는 새가 벌레를 잡는다","준비하고 먼저 행동하는 사람이 기회를 얻는다.","영어 속담"],["호랑이도 제 말 하면 온다","한국 속담","어떤 사람의 이야기를 할 때 마침 그 사람이 나타난다.","한국 속담"],["가는 말이 고와야 오는 말이 곱다","한국 속담","상대에게 좋은 말을 해야 좋은 대답을 듣는다.","한국 속담"],["티끌 모아 태산","한국 속담","작은 것도 꾸준히 모으면 큰 것이 된다.","한국 속담"],["등잔 밑이 어둡다","한국 속담","가까운 곳의 일을 오히려 알아차리지 못한다.","한국 속담"],["急がば回れ","이소가바 마와레","급할수록 안전하고 확실한 길을 택하라.","일본 속담"],["花より団子","하나요리 당고","겉모습보다 실질적인 이익을 중시한다.","일본 속담"],["不言実行","후겐짓코","말보다 행동으로 실천한다.","일본 사자성어"],["一石二鳥","일석이조","하나의 행동으로 두 가지 이익을 얻는다.","한자 성어"],["自業自得","자업자득","자신의 행동에 따른 결과를 자신이 받는다.","한자 성어"],["有備無患","유비무환","미리 준비하면 근심할 일이 적다.","한자 성어"],["同病相憐","동병상련","비슷한 처지의 사람끼리 서로 이해하고 위로한다.","한자 성어"],["No pain, no gain","노 페인 노 게인","노력 없이는 성과를 얻기 어렵다.","영어 속담"],["Where there is a will, there is a way","뜻이 있는 곳에 길이 있다","의지가 있으면 방법을 찾을 수 있다.","영어 속담"]];const key="wisdom-hour-v1";let state;try{state=JSON.parse(localStorage.getItem(key))||{index:0,saved:[],score:0}}catch(e){state={index:0,saved:[],score:0}}let mode="learn",locked=false;function persist(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function pick(){return entries[((state.index%entries.length)+entries.length)%entries.length]}function render(m){mode=m;locked=false;document.getElementById("notice").textContent="";for(const x of ["learn","quiz","saved"])document.getElementById(x+"Tab").classList.toggle("active",m===x);document.getElementById("count").textContent=(state.index%entries.length+1)+" / "+entries.length;const c=document.getElementById("content"),a=document.getElementById("actions");if(m==="learn"){const d=pick();c.innerHTML='<div class="tag">'+esc(d[3])+'</div><div class="word">'+esc(d[0])+'</div><div class="reading">'+esc(d[1])+'</div><div class="meaning">'+esc(d[2])+'</div>';a.innerHTML='<button onclick="next()">다음 문장 →</button><button class="secondary" onclick="save()">♡ 저장</button><button class="outline" onclick="share()">공유</button>'}else if(m==="quiz"){const d=pick(),answer=d[2];let choices=[answer];for(let n=1;n<entries.length&&choices.length<4;n++){const candidate=entries[(state.index+n*7)%entries.length][2];if(!choices.includes(candidate))choices.push(candidate)}choices.sort((a,b)=>a.localeCompare(b,"ko"));c.innerHTML='<div class="tag">뜻을 맞혀보세요 · 점수 '+state.score+'</div><div class="word">'+esc(d[0])+'</div>'+choices.map(o=>'<button class="option" onclick="check(this)" data-answer="'+esc(o)+'">'+esc(o)+'</button>').join("");a.innerHTML='<button onclick="next()">다음 문제 →</button>'}else{const list=state.saved.map(i=>entries[i]).filter(Boolean);c.innerHTML='<div class="tag">저장한 문장 '+list.length+'개</div>'+(list.length?list.map(d=>'<div style="border-bottom:1px solid #eee;padding:14px 0"><b>'+esc(d[0])+'</b><div class="meaning">'+esc(d[2])+'</div></div>').join(""):'<p class="meaning">아직 저장한 문장이 없습니다.</p>');a.innerHTML='<button onclick="render(\'learn\')">문장 보기</button>'}}function next(){state.index=(state.index+1)%entries.length;persist();render(mode==="quiz"?"quiz":"learn")}function save(){const i=state.index%entries.length;if(!state.saved.includes(i))state.saved.push(i);persist();document.getElementById("notice").textContent="즐겨찾기에 저장했습니다."}function check(btn){if(locked)return;locked=true;const good=btn.dataset.answer===pick()[2];if(good){state.score++;persist()}document.querySelectorAll(".option").forEach(b=>b.disabled=true);document.getElementById("notice").textContent=good?"✓ 정답입니다!":"정답: "+pick()[2]}async function share(){const d=pick(),text=d[0]+" — "+d[2];try{if(navigator.share)await navigator.share({title:"Wisdom Hour",text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);document.getElementById("notice").textContent="문장을 복사했습니다."}else document.getElementById("notice").textContent=text}catch(e){}}render("learn");if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script></body></html>
